<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="formulario">
    <div class="modal-header border-0 pb-0 pt-4 px-4">
        <h5 class="modal-title fw-bold text-dark fs-5" 
            th:text="${veterinario.id != null ? 'Editar veterinario' : 'Nuevo veterinario'}">
        </h5>
        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body px-4 py-3">
        <form hx-post="/veterinarios/guardar" 
              hx-target="#tablaVeterinariosCuerpo" 
              hx-swap="innerHTML">

            <!-- ID oculto para edición -->
            <input type="hidden" name="id" th:value="${veterinario.id}">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label-custom">Nombres<span class="text-danger">*</span></label>
                    <input type="text" name="nombres" class="form-control form-control-custom" 
                           th:value="${veterinario.nombres}" placeholder="Andrés" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Apellidos<span class="text-danger">*</span></label>
                    <input type="text" name="apellidos" class="form-control form-control-custom" 
                           th:value="${veterinario.apellidos}" placeholder="Fuentes Mora" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label-custom">Especialidad<span class="text-danger">*</span></label>
                    <input type="text" name="especialidad" class="form-control form-control-custom" 
                           th:value="${veterinario.especialidad}" placeholder="Cirugía" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label-custom">Teléfono<span class="text-danger">*</span></label>
                    <input type="tel" name="telefono" class="form-control form-control-custom" 
                           th:value="${veterinario.telefono}" placeholder="555-1001" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label-custom">Correo electrónico<span class="text-danger">*</span></label>
                <input type="email" name="correo" class="form-control form-control-custom" 
                       th:value="${veterinario.correo}" placeholder="a.fuentes@huellitasvet.com" required>
            </div>

            <!-- Selector de Estado solo si está editando -->
            <div class="mb-4" th:if="${veterinario.id != null}">
                <label class="form-label-custom">Estado</label>
                <select name="activo" class="form-select form-control-custom">
                    <option th:value="true" th:selected="${veterinario.activo}">Activo</option>
                    <option th:value="false" th:selected="${!veterinario.activo}">Inactivo</option>
                </select>
            </div>

            <div class="d-flex align-items-center gap-2 pt-1">
                <button type="submit" class="btn btn-teal-modal">Guardar veterinario</button>
                <button type="button" class="btn btn-cancel-modal" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
